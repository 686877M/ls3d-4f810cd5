<title>Lift Station 3D Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: viewer + sections/export on the left, components and notes on the right. AR/EN switch flips direction. */
:root{--bg:#f4f3ef;--fg:#1d2228;--muted:#5d6670;--line:#d3cec3;--card:#fff;--accent:#b5472c;--scene:#e7e5df;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141820;--fg:#e8ecef;--muted:#9aa4ad;--line:#2d343d;--card:#1b2129;--accent:#e08a6d;--scene:#1a2028;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141820;--fg:#e8ecef;--muted:#9aa4ad;--line:#2d343d;--card:#1b2129;--accent:#e08a6d;--scene:#1a2028;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 "Inter",system-ui,-apple-system,"Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:21px;margin:0 0 2px;text-wrap:balance}
h2{font-size:15px;margin:0 0 8px}
h3{width:100%;margin:10px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
.sub{color:var(--muted);margin:0;max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
#view{position:relative;width:100%;height:min(60vh,540px);min-height:340px;background:var(--scene);border-radius:8px;overflow:hidden;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#cap{position:absolute;left:10px;bottom:10px;right:10px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
#badge{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;display:none}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
button,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang button{padding:4px 12px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.val{font-variant-numeric:tabular-nums;min-width:11ch;color:var(--muted)}
#prev{width:100%;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:160px;overflow:hidden}
#prev svg{display:block;width:100%;height:auto;max-height:420px}
.msg{min-height:1.4em;color:var(--muted);font-size:13px;margin-top:8px}
ul.cmp{list-style:none;margin:0;padding:0}
ul.cmp li{padding:7px 0;border-bottom:1px solid var(--line)}
ul.cmp b{display:block}
ul.cmp span,.small{color:var(--muted);font-size:12.5px}
ol,ul.n{margin:6px 0 0;padding-inline-start:20px}
.small{margin:8px 0 0}
.warn{border-inline-start:3px solid var(--accent);padding-inline-start:10px}
</style>

<header>
  <div><h1 data-i="title"></h1><p class="sub" data-i="sub"></p></div>

</header>
<div class="grid">

  <div class="card">
    <div id="view"><div id="badge" data-i="badge"></div><div id="cap"></div></div>

    <div class="bar" id="spots"></div>
    <div class="bar" id="toggles"></div>

  <div class="card">
    <h2 data-i="sec_h"></h2>
    <p class="small" data-i="sec_p"></p>
    <div class="bar" id="axes"></div>
    <div class="bar"><input type="range" id="pos" aria-label="Cut position"><span class="val" id="posv"></span></div>
    <div class="bar" id="presets"></div>
    <h3 data-i="prev_h"></h3>
    <div id="prev"></div>
  </div>
  <div class="card">
    <h2 data-i="ex_h"></h2>
    <h3 data-i="ex2d"></h3>
    <div class="bar" id="b2d"></div>
    <h3 data-i="ex3d"></h3>
    <div class="bar" id="b3d"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <ol class="small" id="howto"></ol>
  </div>
 </div>
 <div class="col">
  <div class="card"><h2 data-i="cmp_h"></h2><ul class="cmp" id="cmp"></ul>
   <p class="small warn" data-i="cmp_note"></p></div>
  <div class="card"><h2 data-i="lim_h"></h2><ul class="n small" id="lim"></ul></div>
 </div>
</div>

  for(const mk2 in meshes){const pts=new Map(), faces=[]; const P=c=>{const k=c.map(x=>Math.round(x)).join(','); if(!pts.has(k))pts.set(k,E('IFCCARTESIANPOINT(('+c.map(x=>x.toFixed(1)).join(',')+'))')); return pts.get(k);};
   meshes[mk2].forEach(t=>{const a=cad(t.p.slice(0,3)),b=cad(t.p.slice(3,6)),c=cad(t.p.slice(6,9)); const ia=P(a),ib=P(b),ic=P(c); if(ia===ib||ib===ic||ia===ic)return;
    const lp=E('IFCPOLYLOOP((#'+ia+',#'+ib+',#'+ic+'))'), bd=E('IFCFACEOUTERBOUND(#'+lp+',.T.)'); faces.push(E('IFCFACE((#'+bd+'))'));});
   if(faces.length){const sh=E('IFCCLOSEDSHELL((#'+faces.join(',#')+'))'); breps.push(E('IFCFACETEDBREP(#'+sh+')'));}}
  if(!breps.length)continue; const rep=E('IFCSHAPEREPRESENTATION(#'+ctx+','+q('Body')+','+q('Brep')+',(#'+breps.join(',#')+'))'), pd=E('IFCPRODUCTDEFINITIONSHAPE($,$,(#'+rep+'))');
  prox.push(E('IFCBUILDINGELEMENTPROXY('+q(guid())+',#'+own+','+q(names[l])+',$,$,#'+pl(plL)+',#'+pd+',$,$)'));}
 E('IFCRELCONTAINEDINSPATIALSTRUCTURE('+q(guid())+',#'+own+',$,$,(#'+prox.join(',#')+'),#'+sto+')');
 return 'ISO-10303-21;\nHEADER;\nFILE_DESCRIPTION((\'ViewDefinition [CoordinationView]\'),\'2;1\');\nFILE_NAME(\'LiftStation.ifc\',\'2026-11-19T00:00:00\',(\'\'),(\'\'),\'Lift Station Viewer\',\'Lift Station Viewer\',\'\');\nFILE_SCHEMA((\'IFC2X3\'));\nENDSEC;\nDATA;\n'+o.join('\n')+'\nENDSEC;\nEND-ISO-10303-21;\n';}
/* store-only zip */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 files.forEach(f=>{const nm=enc.encode(f.name),d=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  parts.push(new Uint8Array(h.buffer),nm,d);cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length;});
 const cds=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cds,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'});}
function pdf2d(segs,ax,d){const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a3'}); const bb=bounds(segs);
 const w=(bb[2]-bb[0])*1000,h=(bb[3]-bb[1])*1000; const den=[5,10,20,25,50,75,100,200,500].find(k=>w/k<=330&&h/k<=190)||500;
 const ox=20+(380-w/den)/2+0, oy=22+(190-h/den)/2; const X=x=>ox+(x-bb[0])*1000/den, Y=y=>oy+(bb[3]-y)*1000/den;
 doc.setLineWidth(0.5); doc.rect(8,8,404,281); doc.setLineWidth(0.15);
 levelsFor(ax,bb).forEach(l=>{doc.setDrawColor(224,144,58); doc.setLineDash([2,1.2],0); doc.line(X(bb[0])-25,Y(l[1]),X(bb[2])+5,Y(l[1])); doc.setLineDash([]); doc.setTextColor(90); doc.setFontSize(7); doc.text(l[0]+' +'+(BL+l[1]).toFixed(2),X(bb[0])-25,Y(l[1])-0.8);});
 const rgb={'S-CONC':[43,49,56],'S-STEEL':[75,123,181],'M-PIPE':[47,143,184],'M-EQUIP':[181,71,44]};
 segs.forEach(s=>{doc.setDrawColor(...(rgb[s[4]]||[0,0,0])); doc.line(X(s[0]),Y(s[1]),X(s[2]),Y(s[3]));});
 doc.setDrawColor(0); doc.setLineWidth(0.4); doc.rect(8,245,404,44); doc.line(250,245,250,289);
 doc.setTextColor(0); doc.setFontSize(14); doc.text('SEWAGE LIFT STATION',14,256); doc.setFontSize(11); doc.text(secName(ax,d),14,264);
 doc.setFontSize(8); doc.text('Source: sheets BIS-ME-LST-01 and BIS-ME-LST-03. PRELIMINARY, generated from a simplified 3D model. Not for construction.',14,272);
 doc.text('Wall and slab thickness 430 mm. Dimensions in mm, levels in m. Cut outlines only, no hatching.',14,277);
 doc.setFontSize(12); doc.text('Scale 1:'+den+' (A3)',256,256); doc.setFontSize(8); doc.text('Generated 2026-11-19',256,264); doc.text('Colors: concrete dark, steel blue, pipe teal, equipment red',256,270);
 return doc.output('blob');}

/* ================= section UI + export ================= */
let secTimer=null, curSegs=[];
function sectionChanged(){clearTimeout(secTimer); secTimer=setTimeout(drawPrev,90);}
function drawPrev(){curSegs=slice(state.ax,+state.pos); const el=$('prev'); if(!curSegs.length){el.innerHTML='<p class="small" style="padding:12px">'+tr('empty')+'</p>';return;} el.innerHTML=svg2d(curSegs,state.ax,+state.pos,false);}
let dl=null; const b2=$('b2d'), b3=$('b3d'), msg=$('msg');
function say(k,extra){msg.textContent=tr(k)+(extra||'');}
const standalone=typeof claude==='undefined';   // opened as a plain file in a normal browser
function direct(filename,data){const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); say('st_ok',filename);}
// CAD text formats go raw when standalone; inside claude.ai the viewer only saves a few types, so they are zipped
function pack(fname,data,zipName){return standalone?out(fname,data):out(zipName,zip([{name:fname,data}]));}
async function out(filename,data){if(standalone){direct(filename,data);return;} if(!dl){say('st_na');return;} try{await dl.save({filename,data}); say('st_ok',filename);}catch(e){const c=e&&e.code; if(c==='declined')say('st_no'); else if(c==='rejected_extension'||c==='extension_not_enabled')say('st_ext'); else if(c==='unavailable'||c==='not_granted')say('st_na'); else say('st_err',(e&&e.message)||c||'');}}
function safe(fn){return async()=>{try{await fn();}catch(e){say('st_err',(e&&e.message)||String(e));}};}
const nm=()=>'LiftStation_'+(state.ax===1?'Plan_Y':'Section_'+AXN[state.ax].toUpperCase())+state.pos.toString().replace('.','_').replace('-','m');
const needSeg=()=>{if(!curSegs.length)throw new Error(tr('empty'));};
mk(b2,'b_pdf',safe(()=>{needSeg();return out(nm()+'.pdf',pdf2d(curSegs,state.ax,+state.pos));}));
mk(b2,'b_svg',safe(()=>{needSeg();return out(nm()+'.svg',svg2d(curSegs,state.ax,+state.pos,true));}));
mk(b2,'b_dxf2',safe(()=>{needSeg();return pack(nm()+'.dxf',dxf2d(curSegs,state.ax,+state.pos),nm()+'_dxf.zip');}));
mk(b3,'b_dxf3',safe(()=>pack('LiftStation_3D_R12.dxf',dxf3d(),'LiftStation_3D_dxf.zip')));
mk(b3,'b_ifc',safe(()=>pack('LiftStation_IFC2X3.ifc',ifc(),'LiftStation_ifc.zip')));
mk(b3,'b_obj',safe(()=>pack('LiftStation.obj',obj(),'LiftStation_obj.zip')));
(async()=>{if(standalone)return; try{dl=await claude.use('downloads');}catch(e){dl=null;} if(!dl)say('st_na');})();

/* ================= language ================= */
function buildStatic(){
 $('howto').innerHTML=(typeof claude==='undefined'?['how1','how2']:['how1','how2','how3']).map(k=>'<li data-i="'+k+'"></li>').join('');
 $('lim').innerHTML=['lim1','lim2','lim3','lim4','lim5','lim6'].map(k=>'<li data-i="'+k+'"></li>').join('');
 $('cmp').innerHTML=L.en.cm.map((c,i)=>'<li><b data-cmt="'+i+'"></b><span data-cmd="'+i+'"></span></li>').join('');}
function applyLang(){document.documentElement.lang=lang; document.body.dir=lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
 const cm=L[lang].cm; document.querySelectorAll('[data-cmt]').forEach(e=>e.textContent=cm[+e.dataset.cmt][0]); document.querySelectorAll('[data-cmd]').forEach(e=>e.textContent=cm[+e.dataset.cmd][1]);
 $('lAr').classList.toggle('on',lang==='ar'); $('lEn').classList.toggle('on',lang==='en'); setCap(); posLabel(); drawPrev();
 if(!dl&&!standalone)say('st_na'); document.title=lang==='ar'?'موديل 3D لمحطة الصرف':'Lift Station 3D Model';
 try{localStorage.setItem('lsv-lang',lang);}catch(e){}}
$('lAr').onclick=()=>{lang='ar';applyLang();}; $('lEn').onclick=()=>{lang='en';applyLang();};
try{const s=localStorage.getItem('lsv-lang'); if(s==='en'||s==='ar')lang=s;}catch(e){}

/* ================= loop ================= */
function resize(){const w=host.clientWidth,h=host.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);
function theme(){scene.background=new T.Color(css('--scene')||'#e7e5df');}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
buildStatic(); theme(); setAxis(2,false); state.pos=0; pos.value=0; syncUI(); apply(); resize(); applyLang(); go(views[0]);
renderer.setAnimationLoop(now=>{stepTween(now); controls.update(); renderer.render(scene,camera);});
window.__lsv={collect,slice,svg2d,dxf2d,dxf3d,ifc,obj,pdf2d,zip,state};
})();
