<title>Lift Station 3D Model</title>
<style>
/* Layout: big viewer with toolbar and transport on the left, tabbed tool panel on the right. Logical properties keep RTL/LTR working. */
:root{--bg:#eceff2;--panel:#ffffff;--panel2:#f5f7f9;--fg:#16202a;--muted:#62707d;--line:#d8dee4;--accent:#0b7285;--accent-fg:#fff;--hot:#d9480f;--scene:#dde4ea;--shadow:0 1px 2px rgba(0,20,40,.08),0 6px 20px rgba(0,20,40,.06);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1218;--panel:#151c25;--panel2:#1b2430;--fg:#e7ecf1;--muted:#92a0ad;--line:#263241;--accent:#3bc9db;--accent-fg:#06222a;--hot:#ff922b;--scene:#111820;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1218;--panel:#151c25;--panel2:#1b2430;--fg:#e7ecf1;--muted:#92a0ad;--line:#263241;--accent:#3bc9db;--accent-fg:#06222a;--hot:#ff922b;--scene:#111820;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif}
.app{max-width:1560px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 28px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:78ch}
.main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:14px;align-items:start}
@media(max-width:1020px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.stage{overflow:hidden}
#view{position:relative;height:clamp(360px,64vh,700px);background:var(--scene);touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#tools{position:absolute;inset-block-start:10px;inset-inline-end:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#tools button{width:38px;height:38px;padding:0;font-weight:600;font-size:15px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(4px)}
#badge{position:absolute;inset-block-start:10px;inset-inline-start:10px;background:var(--hot);color:#fff;border-radius:999px;padding:2px 11px;font-size:12px;display:none;z-index:2}
#cap{position:absolute;inset-inline:10px;inset-block-end:10px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;z-index:2;max-height:34%;overflow:auto}
#cap b{color:var(--accent)}
#meas{position:absolute;inset-inline-start:10px;inset-block-start:44px;font-size:12px;color:var(--muted);z-index:2}
.transport{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel2)}
.transport .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.transport input[type=range]{width:100%}
@media(max-width:700px){.transport{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{border-radius:8px;padding:5px 10px;font-size:13px}
.pane{display:none;padding:12px 14px;overflow:auto;max-height:calc(clamp(360px,64vh,700px) + 60px)}
.pane.on{display:block}
@media(max-width:1020px){.pane{max-height:none}}
h2{font-size:14px;margin:0 0 6px}
h3{font-size:11.5px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
p.s,.small{color:var(--muted);font-size:12.5px;margin:4px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
button,select,input[type=number],input[type=text]{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=range]{accent-color:var(--accent);min-width:120px;flex:1}
input[type=number]{width:84px}
input[type=text]{flex:1;min-width:120px}
.prm{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr 84px;gap:8px;align-items:center;margin:5px 0}
.val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.warn{border-inline-start:3px solid var(--hot);padding-inline-start:10px;color:var(--muted);font-size:12.5px;margin:8px 0}
ul.l{margin:6px 0;padding-inline-start:18px}ul.l li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.steps button{display:block;width:100%;text-align:start;margin:4px 0;border-radius:10px}
.steps button b{display:block}
.steps button span{font-size:12px;opacity:.85}
.pitem{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:start;margin:4px 0}
#prev{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--fg);overflow:hidden;min-height:120px}
#prev svg{display:block;width:100%;height:auto;max-height:380px}
.msg{min-height:1.4em;color:var(--muted);font-size:13px;margin-top:8px}
.lang button{padding:5px 14px}
#errbar{position:fixed;z-index:99;inset-inline:0;top:0;background:#8a1f11;color:#fff;padding:8px 14px;font:13px/1.4 system-ui,sans-serif;direction:ltr}
</style>
<body>
<div id="errbar" hidden></div>
<script>window.addEventListener('error',function(e){var b=document.getElementById('errbar');if(b){b.hidden=false;b.textContent='Script error: '+(e.message||e.error)+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')';}});</script>

 </div>
</div>
